name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'game/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate story graph and JavaScript
        run: |
          cd game
          node validate.js
          node --check story.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts, 'No inline game engine found'
          Path('/tmp/game-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/game-inline.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets
          cp game/index.html android/app/src/main/assets/index.html
          cp game/story.js android/app/src/main/assets/story.js
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: posledniy-zvonok-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
