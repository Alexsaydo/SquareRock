let state=null, currentPuzzleChoice=null;
function freshState(){return {scene:STORY.start,clues:[],visited:[],solved:[],started:false,ended:false,attempts:{},created:Date.now()}}
function saveNow(){if(!state)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));toast("Прогресс сохранён");}catch(e){toast("Не удалось сохранить прогресс");}}
function loadState(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return null;const x=JSON.parse(raw);if(!x||!STORY.scenes[x.scene])return null;return x}catch(e){return null}}
function toast(message){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#252c2e;border:1px solid #596064;border-radius:7px;padding:9px 14px;font:12px system-ui;color:#eee;z-index:40";document.body.appendChild(t)}t.textContent=message;t.style.display="block";clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.style.display="none",1800)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addClues(list){(list||[]).forEach(id=>{if(clueBook[id]&&!state.clues.includes(id))state.clues.push(id)})}
function updateProgress(){const done=state?state.visited.length:0;document.getElementById("progress").style.width=Math.min(100,done/Object.keys(STORY.scenes).length*100)+"%"}
function startGame(){const old=loadState();if(old&&!old.ended){if(confirm("Найдено сохранение. Продолжить расследование?")){state=old;render();return}}state=freshState();state.started=true;enterScene(STORY.start)}
function resumeGame(){state=loadState()||freshState();state.started=true;render()}
function newGame(){if(confirm("Начать дело заново? Текущее сохранение будет заменено.")){state=freshState();state.started=true;enterScene(STORY.start);}}
function showHelp(){document.getElementById("app").innerHTML='<div class="eyebrow">Памятка детектива</div><h2>Как вести расследование</h2><div class="scene-text"><p>Читайте показания внимательно: время, привычки и мелкие детали могут оказаться важнее прямых обвинений.</p><p>Кнопка «Досье» открывает найденные улики. Они сохраняются автоматически. Не все персонажи говорят правду, но не каждое противоречие означает убийство.</p><p>Логические задачи решаются текстом. Если застряли, используйте подсказку. Неправильный ответ не блокирует сюжет.</p><p>Игра работает без интернета. Закрывайте приложение в любой момент — прогресс сохранится на этом устройстве.</p></div><div class="actions"><button class="primary" onclick="startGame()">Начать расследование</button><button class="secondary" onclick="renderHome()">Назад</button></div>'}
function renderHome(){const saved=loadState();document.getElementById("app").innerHTML='<div class="eyebrow">Петрозаводск · ноябрь 2003</div><h1>Последний звонок</h1><p class="subtitle">У некоторых дверей нет замков. Только люди, которые не хотят, чтобы их открывали.</p><div class="rule"></div><div class="scene-text"><p>Вчера в 23:41 вам позвонил Виктор Ларин, бухгалтер лесоторговой компании «Кареллес». Он сказал: «Если со мной что-нибудь случится, найдите плёнку. Не верьте времени в протоколе. И не отдавайте её Климову».</p><p>Сегодня утром Ларина нашли мёртвым. Деньги и техника остались на месте. Исчезли только документы и кассета автоответчика.</p><p>Вы — частный детектив. У вас нет полномочий следователя, зато есть время задавать вопросы тем, кто не хочет говорить с милицией.</p></div><div class="choices"><button class="primary" onclick="startGame()">Начать расследование <small>Дело № 17 · 5 глав · текстовые загадки</small></button>'+(saved?'<button class="choice" onclick="resumeGame()">Продолжить с сохранения <small>Ваш прогресс найден на этом устройстве</small></button>':'')+'<button class="choice" onclick="showHelp()">Как устроена игра <small>Улики, сохранение и логические задачи</small></button></div>'}
const REQUIRED_EVIDENCE=[
{label:"Финансовая схема",clues:["original_ledger","three_person_scheme","bank_transfer_chain","zorin_document_access"]},
{label:"Орудие убийства",clues:["bronze_repair_order","expert_weapon_match","figure_scratch_match","figure_can_be_weapon"]},

{label:"Последний звонок",clues:["home_line_call","station_audio_not_location","sound_timeline_understood","radio_original_confirmed"]},
{label:"Действия после убийства",clues:["garage_visit_after_murder","zorin_returned_after_one","zorin_private_warehouse","packing_fabric"]}

function investigationGaps(){
 const found=new Set(state.clues);
 const gaps=REQUIRED_EVIDENCE.map(group=>{
  const missing=group.clues.filter(clue=>!found.has(clue));
  return missing.length?{label:group.label,missing:missing.length}:null;
 }).filter(Boolean);
 if(state.visited.length<24)gaps.unshift({label:"Полное расследование",missing:24-state.visited.length});
 return gaps;
}

if(s.puzzle&&state.solved.includes(state.scene)){html+=`<div class="actions"><button class="primary" onclick="continuePuzzle()">Продолжить расследование</button></div>`}
html+='<div class="actions"><button class="secondary" onclick="openDossier()">Открыть досье ('+state.clues.length+')</button><button class="secondary" onclick="saveNow()">Сохранить сейчас</button></div>';

function renderPuzzle(p,solved){let html='<div class="panel"><div class="panel-label">Логическая задача</div><h3>'+escapeHtml(p.prompt)+'</h3>';
if(solved){html+='<div class="feedback good">'+escapeHtml(p.explanation)+'</div>'}
else if(p.type==="choice"){html+='<div class="option-list">'+p.options.map((o,i)=>'<label class="option"><input type="radio" name="puzzle-choice" value="'+i+'"> <span>'+escapeHtml(o)+'</span></label>').join("")+'</div><button class="primary" onclick="checkPuzzle()">Проверить ответ</button>'}
else{html+='<input class="puzzle-input" id="puzzle-answer" type="text" autocomplete="off" placeholder="Ваш ответ"><button class="primary" onclick="checkPuzzle()">Проверить ответ</button>'}
html+='<div id="puzzle-feedback"></div>'+(solved?'':'<div class="actions"><button class="secondary" onclick="showHint()">Подсказка</button></div>')+'</div>';return html}
function checkPuzzle(){const s=STORY.scenes[state.scene],p=s.puzzle;let correct=false;if(p.type==="choice"){const el=document.querySelector('input[name="puzzle-choice"]:checked');if(!el){toast("Сначала выберите вариант");return}correct=Number(el.value)===p.correct}else{const value=(document.getElementById("puzzle-answer").value||"").trim().toLowerCase().replace(/\s+/g," ");correct=p.answers.some(a=>a.toLowerCase()===value)}
if(correct){state.solved.push(state.scene);addClues(s.clues);saveSilent();document.getElementById("puzzle-feedback").innerHTML='<div class="feedback good">'+escapeHtml(p.explanation)+'</div>'+ '<button class="primary" style="width:100%;margin-top:12px" onclick="continuePuzzle()">Продолжить</button>'}
else{state.attempts[state.scene]=(state.attempts[state.scene]||0)+1;document.getElementById("puzzle-feedback").innerHTML='<div class="feedback bad">Пока не сходится. Попробуйте ещё раз. Ошибка не блокирует расследование.</div>';saveSilent()}}
function continuePuzzle(){const s=STORY.scenes[state.scene];if(s&&s.next)enterScene(s.next)}
function showHint(){const p=STORY.scenes[state.scene].puzzle;document.getElementById("puzzle-feedback").innerHTML='<div class="note">'+escapeHtml(p.hint)+'</div>'}
function choose(i){const s=STORY.scenes[state.scene];const c=s.choices[i];if(c)enterScene(c.to)}
function openDossier(){if(!state){state=loadState();if(!state){toast("Сначала начните расследование");return}}const list=state.clues.map(id=>'<div class="clue"><strong>'+escapeHtml((clueBook[id]||["Неизвестная улика"])[0])+'</strong><span>'+escapeHtml((clueBook[id]||["",""])[1])+'</span></div>').join("");document.getElementById("dossier-content").innerHTML=list?'<div class="dossier">'+list+'</div>':'<p class="muted">Пока нет найденных улик. Осматривайте места и разговаривайте со свидетелями.</p>';document.getElementById("sheet-title").textContent="Досье · "+state.clues.length+" улик";document.getElementById("modal").classList.add("open")}
function closeDossier(){document.getElementById("modal").classList.remove("open")}
function renderDossierEnd(){openDossier()}
function gameBack(){if(document.getElementById("modal").classList.contains("open"))closeDossier();else openDossier()}
window.gameBack=gameBack;
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeDossier()});
(function init(){const saved=loadState();if(saved&&saved.started){state=saved;render()}else renderHome()})();
</script>
</body></html>
